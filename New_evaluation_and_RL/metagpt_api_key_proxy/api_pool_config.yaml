# 注意事项：
# 1. 每个API endpoint必须包含以下字段：
#    - target_url: API的URL地址
#    - target_api_key: API密钥
#    - rate_per_second: 速率限制（支持小数，如0.5表示2秒一个请求）
#    - max_concurrency: 最大并发请求数
# 2. 每个API的限制是独立的，互不影响
# 3. 总吞吐量 = 所有API的rate_per_second之和
# 4. 代理会自动在这些API之间进行Round-Robin负载均衡
# 5. 如果某个API失败或达到限制，会自动尝试下一个API
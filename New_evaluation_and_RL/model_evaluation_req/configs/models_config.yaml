# ================================
# NOTES / 注意事项
# ================================
# 
# 1. Model Types:
#    - api: API-based models (OpenAI, Azure, custom)
#    - local: Local model files
#    - huggingface: Models from HuggingFace Hub
#    - checkpoint: Fine-tuned checkpoints
#    - local_with_lora: Models with LoRA adapters
#
# 2. API Configuration:
#    - Can specify multiple endpoints for load balancing
#    - Supports different API types (openai, azure, custom)
#    - API keys can be environment variables: ${OPENAI_API_KEY}
#
# 3. Local Model Configuration:
#    - Supports quantization (8-bit, 4-bit) with bitsandbytes
#    - Can specify device mapping strategy
#    - Supports various torch dtypes
#
# 4. LoRA Configuration:
#    - Requires both base model and LoRA adapter paths
#    - Can combine with quantization
#    - Automatically merges weights when possible
#
# 5. Generation Parameters:
#    - Can be set globally or per-model
#    - Model-specific parameters override global ones
#    - Common parameters: max_new_tokens, temperature, top_p, top_k
#
# 6. Performance Tips:
#    - Use quantization for large models to save memory
#    - Adjust batch_size based on available GPU memory
#    - API models can be faster but may have rate limits
#    - Local models provide more control but require GPU resources
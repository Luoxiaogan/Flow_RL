# Unified Model Evaluation Configuration
# 统一的模型评估配置文件 - 支持本地模型和API模型

# ================================
# TEST DATA CONFIGURATION / 测试数据配置
# ================================
test_data:
  # Path to test data JSONL file
  path: "../../generate_parquet_and_jsonl/test_scoreflow_data_all/test.jsonl"
  
  # Maximum number of samples to evaluate (null for all)
  max_samples: 10000  # 快速测试可设置为 10-50

# ================================
# REWARD SERVER CONFIGURATION / Reward服务器配置
# ================================
reward_server:
  url: "http://localhost:7788"

# ================================
# EVALUATION SETTINGS / 评估设置
# ================================
evaluation:
  # Batch size for processing
  batch_size: 8
  
  # Output directory for reports
  output_dir: "./evaluation_reports"
  
  # Save intermediate results after each model
  save_intermediate: true

# ================================
# MODELS TO EVALUATE / 待评估的模型列表
# ================================
models:
  
  # -----------------------------------------------------------------------------
  # JSONL MODELS / JSONL预生成模型示例 - 用于评估RL训练验证日志
  # -----------------------------------------------------------------------------
  # 注意：只支持精确匹配，确保评估准确性
  
  # - name: "RL-Training-Step-100"
  #   type: "jsonl"
  #   jsonl_path: "../val_logs/20241212_150000/100.jsonl"
  
  # - name: "RL-Training-Step-500"
  #   type: "jsonl"
  #   jsonl_path: "../val_logs/20241212_150000/500.jsonl"
  
  # # 多文件合并示例 - 可以合并多个步数的输出
  # - name: "RL-Training-Combined"
  #   type: "jsonl"

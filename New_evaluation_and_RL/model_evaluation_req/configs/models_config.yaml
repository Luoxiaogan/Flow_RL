  #     - "../val_logs/20241212_150000/100.jsonl"
  #     - "../val_logs/20241212_150000/500.jsonl"
  #     - "../val_logs/20241212_150000/1000.jsonl"
  
  # -----------------------------------------------------------------------------
  # API MODELS / API模型示例
  # -----------------------------------------------------------------------------
  - name: "qwen-turbo"
    type: "api"
    api_endpoints:
      - "http://localhost:5059"  # 使用正确的API代理端口
    api_keys:
      - ""
    model: "qwen-turbo"
    api_type: "openai"
    max_retries: 1
    timeout: 600
    max_concurrency: 40  # 并发请求数，根据API速率限制调整
    generation_params:
      max_new_tokens: 4096
      temperature: 1
      top_p: 0.9


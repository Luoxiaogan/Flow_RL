# ============================================
# 评测系统统一配置文件
# ============================================
# 所有服务和脚本共享此配置

# 服务配置
services:
  metagpt_api_proxy:    # MetaGPT operator执行时使用的API代理
    enabled: true
    host: "localhost"
    port: 5009
    target_url: "https://idealab.alibaba-inc.com/api/openai/v1"
    # target_url: "https://dashscope.aliyuncs.com/compatible-mode/v1"
    target_api_key: "956c41bd0f31beaf68b871d4987af4bb"  # 目标API的密钥
    rate_per_second: 3      # 每秒分发请求数
    max_concurrency: 6       # 最大并发数
    queue_type: "default"    # 队列类型: default | random
    
  scoreflow_reward:
    enabled: true
    host: "0.0.0.0"
    port: 8899
    timeout: 300            # 超时时间（秒）
    debug: false

# 模型配置
model:
  # 模式选择: local | api
  mode: "local"
  
  # 本地模型配置（mode=local时使用）
  local:
    model_path: "/nas/models/Qwen2.5-7B-Instruct"
    port: 30009
    tensor_parallel: 1
    data_parallel: 1
    mem_fraction_static: 0.85
    startup_timeout: 180    # SGLang启动超时（秒）
    debug_mode: true       # 是否显示SGLang详细输出
    
  # API模型配置（mode=api时使用）
  api:
    url: "http://localhost:5009/v1/chat/completions"  # 使用本地API代理
    # url: "https://api.openai.com/v1/chat/completions"
    key: "your-api-key"
    model: "gpt-4"
    # model: "qwen-max-latest"

# 评测参数
evaluation:
  # 数据配置
  test_data: "/nas/ganluo/Flow_RL/Test_FILE/verl_support/data/test_new/test.parquet"
  output_dir: "/nas/ganluo/Flow_RL/evaluation_workflow/results"
  
  # 推理参数
  batch_size: 50               # 批处理大小
  temperature: 0.7             # 生成温度
  max_tokens: 8192             # 最大生成token数
  
  # 可选参数
  limit: null                  # 样本限制（null表示全部）
  skip_scoring: false          # 是否跳过评分
  save_intermediate: true      # 是否保存中间结果
  
# 日志配置
logging:
  level: "INFO"                # 日志级别: DEBUG | INFO | WARNING | ERROR
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  file: "/nas/ganluo/Flow_RL/evaluation_workflow/logs/evaluation.log"
  
# 路径配置
paths:
  # 必需的外部组件（绝对路径，需要根据服务器环境修改）
  scoreflow_handlers: "/nas/ganluo/Flow_RL/ScoreFlow/scripts"
  benchmark_mapping: "/nas/ganluo/Flow_RL/ScoreFlow/benchmark_mapping.jsonl"
  processed_dataset: "/nas/ganluo/Flow_RL/Processed_dataset"  # 数据集根目录
  metagpt_config: "/nas/ganluo/Flow_RL/metagpt_root/config/config2.yaml"
  
  # 本地工作目录（相对路径）
  workspace: "/nas/ganluo/Flow_RL/metagpt_root/workspace"
  data_dir: "./data"  # 本地数据目录（如需要）
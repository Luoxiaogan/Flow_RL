# Model Pricing Configuration
# 用于效率维度 Reward 计算（三维度扩展时使用）

pricing:
  version: "1.0"
  currency: "CNY"
  unit: "per_1k_tokens"

  models:
    # DashScope Qwen 系列
    qwen-turbo:
      input_price: 0.3
      output_price: 0.6
      avg_latency: 0.5  # 秒
      description: "通义千问-Turbo"

    qwen-plus:
      input_price: 0.8
      output_price: 2.0
      avg_latency: 1.0
      description: "通义千问-Plus"

    qwen-max:
      input_price: 2.0
      output_price: 6.0
      avg_latency: 2.0
      description: "通义千问-Max"

    qwen-max-longcontext:
      input_price: 2.0
      output_price: 6.0
      avg_latency: 3.0
      description: "通义千问-Max 长上下文版"

    # 本地模型（成本按 GPU 小时计算，此处简化为 0）
    local-7b:
      input_price: 0.0
      output_price: 0.0
      avg_latency: 0.3
      description: "本地 Qwen2.5-7B-Instruct"

    local-72b:
      input_price: 0.0
      output_price: 0.0
      avg_latency: 1.5
      description: "本地 Qwen2.5-72B-Instruct"

  # 工具调用成本
  tools:
    code_execute:
      base_cost: 0.01  # 每次调用基础成本
      time_cost: 0.001  # 每秒执行成本
      description: "代码执行成本"

    search:
      base_cost: 0.05  # 每次搜索成本
      description: "搜索 API 成本"

    generate:
      base_cost: 0.0  # 由 LLM 成本覆盖
      description: "生成工具成本（按 LLM 计费）"

# 效率评估配置
efficiency:
  # 基准配置（用于归一化）
  baseline:
    max_tokens: 10000  # 单次任务最大 token 预算
    max_latency: 60.0  # 最大延迟（秒）
    max_api_calls: 20  # 最大 API 调用次数
    max_cost: 1.0  # 最大成本（CNY）

  # 效率分数计算权重
  weights:
    token_efficiency: 0.4
    latency_efficiency: 0.3
    cost_efficiency: 0.3

  # 惩罚配置
  penalties:
    exceed_token_budget: 0.5  # 超出 token 预算的惩罚系数
    exceed_latency: 0.3  # 超时惩罚
    failed_execution: 1.0  # 执行失败惩罚

# New_Flow_RL Configuration
# 主配置文件

# =============================================================================
# LLM Providers
# =============================================================================
llm_providers:
  # 阿里云 DashScope (Qwen系列模型)
  dashscope:
    base_url: "https://dashscope.aliyuncs.com/compatible-mode/v1"
    api_key: "sk-0040331ac2d442b6b813304a807d88cd"
    default_model: "qwen-turbo"
    temperature: 0.7
    max_tokens: 4096
    timeout: 60

  # 本地 vLLM 服务
  local_vllm:
    base_url: "http://localhost:30009/v1"
    api_key: "EMPTY"
    default_model: "Qwen2.5-7B-Instruct"
    temperature: 0.7
    max_tokens: 4096
    timeout: 120

  # 本地 SGLang 服务
  local_sglang:
    base_url: "http://localhost:30010/v1"
    api_key: "EMPTY"
    default_model: "Qwen2.5-7B-Instruct"
    temperature: 0.7
    max_tokens: 4096
    timeout: 120

# =============================================================================
# Services Configuration
# =============================================================================
services:
  # Reward 计算服务
  reward_server:
    enabled: true
    host: "0.0.0.0"
    port: 7788
    timeout: 60
    max_concurrent: 50

  # API 代理服务
  api_proxy:
    enabled: true
    host: "0.0.0.0"
    port: 5059
    timeout: 60
    max_concurrent: 100
    rate_limit:
      requests_per_minute: 100
      tokens_per_minute: 100000

  # Tool 执行服务
  tool_executor:
    enabled: true
    host: "0.0.0.0"
    port: 8080
    timeout: 30
    sandbox:
      enabled: true
      max_execution_time: 30
      memory_limit_mb: 512

  # SGLang 推理服务
  inference:
    enabled: true
    host: "0.0.0.0"
    port: 30009
    model_path: "Qwen/Qwen2.5-7B-Instruct"
    tensor_parallel_size: 4
    gpu_memory_utilization: 0.9

# =============================================================================
# Reward Configuration
# =============================================================================
reward:
  # 当前使用简单 outcome reward
  reward_manager: "simple"  # simple | multi_dimension

  # 简单模式配置
  simple:
    source: "handler.judge"  # 来源：benchmark的judge函数
    # 返回：1.0 正确 / 0.0 错误

  # 三维度扩展配置（预留）
  dimensions:
    outcome:
      enabled: true
      weight: 0.6
      description: "任务完成正确性"

    efficiency:
      enabled: false  # 当前禁用
      weight: 0.3
      description: "执行效率（token消耗、延迟）"
      metrics:
        - token_cost
        - latency
        - api_calls

    preference:
      enabled: false  # 当前禁用
      weight: 0.1
      description: "用户偏好对齐"

# =============================================================================
# Training Configuration
# =============================================================================
training:
  # 数据配置
  data:
    train_file: "data/processed/train.parquet"
    val_file: "data/processed/val.parquet"
    batch_size: 16
    max_prompt_length: 2048
    max_response_length: 2048

  # Actor 模型配置
  actor:
    model_path: "Qwen/Qwen2.5-7B-Instruct"
    learning_rate: 5e-7
    warmup_ratio: 0.1
    weight_decay: 0.01

  # Critic 模型配置（如果使用PPO）
  critic:
    enabled: false
    model_path: "Qwen/Qwen2.5-7B-Instruct"
    learning_rate: 1e-6

  # 训练器配置
  trainer:
    algorithm: "grpo"  # grpo | ppo | dapo
    total_epochs: 3
    save_freq: 10
    test_freq: 5
    gradient_accumulation_steps: 4
    max_grad_norm: 1.0

  # GRPO 特定配置
  grpo:
    group_size: 8
    kl_coef: 0.05
    clip_range: 0.2
    entropy_coef: 0.01

  # GPU 分配
  gpu:
    trainer_gpus: [0, 1, 2, 3]
    inference_gpus: [4, 5, 6, 7]

# =============================================================================
# Benchmarks Configuration
# =============================================================================
benchmarks:
  gsm8k:
    enabled: true
    data_path: "data/raw/gsm8k"
    handler: "src.benchmarks.gsm8k.handler.GSM8KHandler"

  mbpp:
    enabled: true
    data_path: "data/raw/mbpp"
    handler: "src.benchmarks.mbpp.handler.MBPPHandler"

  hotpotqa:
    enabled: true
    data_path: "data/raw/hotpotqa"
    handler: "src.benchmarks.hotpotqa.handler.HotpotQAHandler"

# =============================================================================
# Logging Configuration
# =============================================================================
logging:
  level: "INFO"  # DEBUG, INFO, WARNING, ERROR, CRITICAL
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  log_dir: "logs"
  use_color: true

  # WandB 配置
  wandb:
    enabled: false
    project: "new_flow_rl"
    entity: null
    run_name: null

# =============================================================================
# Paths Configuration
# =============================================================================
paths:
  data_dir: "data"
  checkpoint_dir: "data/checkpoints"
  log_dir: "logs"
  cache_dir: ".cache"

# Accelerate配置文件 - 8卡分布式训练
# 简化版本，替代复杂的7+1卡架构

compute_environment: LOCAL_MACHINE
debug: false
distributed_type: MULTI_GPU
downcast_bf16: 'no'
machine_rank: 0
main_training_function: main
mixed_precision: bf16  # 使用BF16混合精度（H100原生支持）
num_machines: 1
num_processes: 8  # 8卡均匀分布式训练
rdzv_backend: static
same_network: true
tpu_env: []
tpu_use_cluster: false
tpu_use_sudo: false
use_cpu: false

# GPU标识配置（可选）
gpu_ids: "0,1,2,3,4,5,6,7"

# DeepSpeed配置（如果需要的话，保持简单）
# deepspeed_config: null  # 不使用DeepSpeed，使用标准Accelerate分布式
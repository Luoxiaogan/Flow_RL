# 原地模型评估配置文件 - 简化版本
# 移除了复杂的GPU 7特定设置，支持标准8卡Accelerate训练

# 测试数据配置
test_data:
  # 测试数据路径（相对于项目根目录）
  # 格式：{"data_source": "...", "prompt": [...], "extra_info": {...}}
  path: "New_evaluation_and_RL/parquet_and_jsonl_data/test.jsonl"
  
  # 不同基准测试的备选路径（相对于项目根目录）
  benchmark_paths:
    gsm8k: "New_evaluation_and_RL/parquet_and_jsonl_data/single/gsm8k_test.jsonl"
    mbpp: "New_evaluation_and_RL/parquet_and_jsonl_data/single/mbpp_test.jsonl"
    drop: "New_evaluation_and_RL/parquet_and_jsonl_data/single/drop_test.jsonl"
    humaneval: "New_evaluation_and_RL/parquet_and_jsonl_data/single/humaneval_test.jsonl"

# 评估调度 - 简化版本，无需考虑7+1卡资源分配
schedule:
  # 每N个训练步评估一次
  interval: 3
  
  # 评估的最大样本数（None表示全部）
  max_samples: 1  # 测试时减少，生产环境设为null
  
  # 评估批次大小 - 8卡可以共享负载
  batch_size: 1

# Tokenization参数（输入长度控制）
tokenization:
  # 输入prompt的最大长度（需要给生成预留空间）
  max_input_length: 6500  # 允许较长的prompt输入
  # 注意：max_input_length + max_new_tokens ≤ 模型最大长度(通常8192)
  # 当前设置：6000 + 2048 = 8048 < 8192 ✓

# 生成参数（评估时使用）
generation:
  # 核心参数：这些参数作为基础，模型自带的配置会覆盖这些值
  max_new_tokens: 2400  # 适中的生成长度（关键参数，通常模型没有定义）
  temperature: 0.6      # 控制创造性（较低值=更确定性输出）
  top_p: 0.95          # 核采样阈值
  top_k: 20            # Top-K采样（与top_p配合使用）
  do_sample: true      # 启用采样策略（而非贪婪解码）
  
  # 注意：以下参数已删除，因为它们是无效的默认值
  # - repetition_penalty: 1.0 (等于没有惩罚，让模型自己决定)
  # - early_stopping: false (默认值，只在beam search时有意义)
  # - num_beams: 1 (默认值，表示不使用beam search)
  # - use_model_config: true (代码已无条件加载模型配置)

# Reward服务器配置
reward_server:
  # 配置路径（相对于项目根目录）
  config_path: "New_evaluation_and_RL/config.yaml"
  
  # 配置文件未找到时的备用设置
  fallback:
    host: "localhost"
    port: 8897
    timeout: 300  # 秒
  
  # 请求设置
  max_retries: 3
  retry_delay: 5  # 秒

# 输出配置
output:
  # 评估报告的基础目录
  base_dir: "${OUTPUT_DIR}/evaluation_reports"
  
  # 报告格式
  formats:
    - json  # 机器可读
    - markdown  # 人类可读
  
  # 保存中间结果
  save_intermediate: true
  
  # 保存生成的workflow以便调试
  save_generations: true
  generations_dir: "${OUTPUT_DIR}/evaluation_generations"

# 日志
logging:
  # 评估日志级别
  level: INFO  # DEBUG、INFO、WARNING、ERROR
  
  # 将评估指标输出到控制台
  console_metrics: true
  
  # 输出到文件
  file: "${OUTPUT_DIR}/evaluation.log"

# 性能优化 - 针对8卡Accelerate优化
optimization:
  # 评估后清空GPU缓存
  clear_cache: true
  
  # 评估时使用混合精度（与训练一致）
  use_fp16: false  # 在H100上使用bf16代替
  use_bf16: true
  
  # 编译模型以加快推理速度（实验性功能）
  compile_model: false

# 检查点选择（未来功能）
checkpoint_selection:
  # 基于评估分数保存最佳检查点
  save_best: true
  
  # 跟踪的指标
  metric: "overall_score"
  
  # 模式："max"或"min"
  mode: "max"
  
  # 早停的耐心值
  patience: 5

# 简化的加速器设置（无需复杂的GPU资源管理）
accelerate:
  # 所有GPU都用于训练，评估时暂停训练使用当前模型
  training_devices: "all"  # 使用所有可用GPU进行训练
  
  # 评估时的内存优化
  eval_memory_efficient: true
  
  # 梯度检查点（节省内存）
  gradient_checkpointing: true
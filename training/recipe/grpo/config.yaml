# GRPO Training Configuration
# Configuration for Workflow GRPO Trainer

# Model Configuration
model:
  name_or_path: "Qwen/Qwen2.5-7B-Instruct"
  torch_dtype: "bfloat16"
  use_flash_attention: true

# Reward Server
reward_server:
  url: "http://localhost:7788"
  timeout: 300

# Generation Configuration
generation:
  max_turns: 3
  test_problems_per_workflow: 10
  timeout_per_problem: 60
  temperature: 0.7
  top_p: 0.9
  max_new_tokens: 2048

# Training Configuration
training:
  batch_size: 8
  num_rollouts_per_prompt: 4
  learning_rate: 1.0e-5
  max_grad_norm: 1.0
  warmup_steps: 100
  num_epochs: 3
  gradient_accumulation_steps: 4

# GRPO Specific
grpo:
  kl_coef: 0.1
  clip_range: 0.2
  gamma: 1.0

# Logging
logging:
  log_interval: 10
  save_interval: 100
  eval_interval: 50
  wandb_project: "new_flow_rl"
  wandb_run_name: "grpo_workflow"

# Paths
paths:
  output_dir: "./outputs"
  checkpoint_dir: "./checkpoints"
  data_dir: "./data/processed"

# Benchmark
benchmark:
  name: "gsm8k"
  train_split: "train"
  eval_split: "test"
  max_train_samples: 1000
  max_eval_samples: 100

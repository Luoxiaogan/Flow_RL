hydra:
  run:
    dir: outputs/${now:%Y-%m-%d}/${now:%H-%M-%S}
  sweep:
    dir: multirun/${now:%Y-%m-%d}/${now:%H-%M-%S}
    subdir: ${hydra.job.num}
  launcher:
    _target_: hydra._internal.core_plugins.basic_launcher.BasicLauncher
  sweeper:
    _target_: hydra._internal.core_plugins.basic_sweeper.BasicSweeper
    max_batch_size: null
    params: null
  help:
    app_name: ${hydra.job.name}
    header: '${hydra.help.app_name} is powered by Hydra.

      '
    footer: 'Powered by Hydra (https://hydra.cc)

      Use --hydra-help to view Hydra specific help

      '
    template: '${hydra.help.header}

      == Configuration groups ==

      Compose your configuration from those groups (group=option)


      $APP_CONFIG_GROUPS


      == Config ==

      Override anything in the config (foo.bar=value)


      $CONFIG


      ${hydra.help.footer}

      '
  hydra_help:
    template: 'Hydra (${hydra.runtime.version})

      See https://hydra.cc for more info.


      == Flags ==

      $FLAGS_HELP


      == Configuration groups ==

      Compose your configuration from those groups (For example, append hydra/job_logging=disabled
      to command line)


      $HYDRA_CONFIG_GROUPS


      Use ''--cfg hydra'' to Show the Hydra config.

      '
    hydra_help: ???
  hydra_logging:
    version: 1
    formatters:
      simple:
        format: '[%(asctime)s][HYDRA] %(message)s'
    handlers:
      console:
        class: logging.StreamHandler
        formatter: simple
        stream: ext://sys.stdout
    root:
      level: INFO
      handlers:
      - console
    loggers:
      logging_example:
        level: DEBUG
    disable_existing_loggers: false
  job_logging:
    version: 1
    formatters:
      simple:
        format: '[%(asctime)s][%(name)s][%(levelname)s] - %(message)s'
    handlers:
      console:
        class: logging.StreamHandler
        formatter: simple
        stream: ext://sys.stdout
      file:
        class: logging.FileHandler
        formatter: simple
        filename: ${hydra.runtime.output_dir}/${hydra.job.name}.log
    root:
      level: INFO
      handlers:
      - console
      - file
    disable_existing_loggers: false
  env: {}
  mode: RUN
  searchpath: []
  callbacks: {}
  output_subdir: .hydra
  overrides:
    hydra:
    - hydra.mode=RUN
    task:
    - algorithm.adv_estimator=grpo
    - data.train_files=['/nas/ganluo/Flow_RL/Test_FILE/verl_support/data/test_new_test/train.parquet']
    - data.val_files=['/nas/ganluo/Flow_RL/Test_FILE/verl_support/data/test_new_test/test.parquet']
    - data.train_batch_size=16
    - data.max_prompt_length=8192
    - data.max_response_length=8192
    - data.filter_overlong_prompts=True
    - data.truncation=error
    - actor_rollout_ref.model.path=/nas/models/Qwen2.5-7B-Instruct
    - actor_rollout_ref.actor.optim.lr=5e-7
    - actor_rollout_ref.actor.ppo_mini_batch_size=8
    - actor_rollout_ref.actor.ppo_micro_batch_size_per_gpu=2
    - actor_rollout_ref.actor.use_kl_loss=True
    - actor_rollout_ref.actor.kl_loss_coef=0.001
    - actor_rollout_ref.actor.kl_loss_type=low_var_kl
    - actor_rollout_ref.actor.entropy_coeff=0
    - actor_rollout_ref.model.enable_gradient_checkpointing=True
    - actor_rollout_ref.rollout.log_prob_micro_batch_size_per_gpu=2
    - actor_rollout_ref.rollout.tensor_model_parallel_size=2
    - actor_rollout_ref.rollout.name=sglang
    - actor_rollout_ref.hybrid_engine=True
    - actor_rollout_ref.rollout.gpu_memory_utilization=0.5
    - actor_rollout_ref.rollout.n=2
    - actor_rollout_ref.ref.log_prob_micro_batch_size_per_gpu=2
    - actor_rollout_ref.actor.use_torch_compile=False
    - actor_rollout_ref.ref.use_torch_compile=False
    - algorithm.use_kl_in_reward=False
    - trainer.critic_warmup=0
    - trainer.logger=["console"]
    - trainer.project_name=verl_grpo_h100_test
    - trainer.experiment_name=qwen2.5_7b_h100_8gpu_test
    - trainer.n_gpus_per_node=8
    - trainer.nnodes=1
    - trainer.save_freq=10
    - trainer.test_freq=2
    - trainer.total_epochs=3
    - ++reward_model.reward_manager=prime
    - ++trainer.default_local_dir=/nas/ganluo/rl_out/checkpoints/test_1_05B
  job:
    name: main_ppo
    chdir: null
    override_dirname: ++reward_model.reward_manager=prime,++trainer.default_local_dir=/nas/ganluo/rl_out/checkpoints/test_1_05B,actor_rollout_ref.actor.entropy_coeff=0,actor_rollout_ref.actor.kl_loss_coef=0.001,actor_rollout_ref.actor.kl_loss_type=low_var_kl,actor_rollout_ref.actor.optim.lr=5e-7,actor_rollout_ref.actor.ppo_micro_batch_size_per_gpu=2,actor_rollout_ref.actor.ppo_mini_batch_size=8,actor_rollout_ref.actor.use_kl_loss=True,actor_rollout_ref.actor.use_torch_compile=False,actor_rollout_ref.hybrid_engine=True,actor_rollout_ref.model.enable_gradient_checkpointing=True,actor_rollout_ref.model.path=/nas/models/Qwen2.5-7B-Instruct,actor_rollout_ref.ref.log_prob_micro_batch_size_per_gpu=2,actor_rollout_ref.ref.use_torch_compile=False,actor_rollout_ref.rollout.gpu_memory_utilization=0.5,actor_rollout_ref.rollout.log_prob_micro_batch_size_per_gpu=2,actor_rollout_ref.rollout.n=2,actor_rollout_ref.rollout.name=sglang,actor_rollout_ref.rollout.tensor_model_parallel_size=2,algorithm.adv_estimator=grpo,algorithm.use_kl_in_reward=False,data.filter_overlong_prompts=True,data.max_prompt_length=8192,data.max_response_length=8192,data.train_batch_size=16,data.train_files=['/nas/ganluo/Flow_RL/Test_FILE/verl_support/data/test_new_test/train.parquet'],data.truncation=error,data.val_files=['/nas/ganluo/Flow_RL/Test_FILE/verl_support/data/test_new_test/test.parquet'],trainer.critic_warmup=0,trainer.experiment_name=qwen2.5_7b_h100_8gpu_test,trainer.logger=["console"],trainer.n_gpus_per_node=8,trainer.nnodes=1,trainer.project_name=verl_grpo_h100_test,trainer.save_freq=10,trainer.test_freq=2,trainer.total_epochs=3
    id: ???
    num: ???
    config_name: ppo_trainer.yaml
    env_set: {}
    env_copy: []
    config:
      override_dirname:
        kv_sep: '='
        item_sep: ','
        exclude_keys: []
  runtime:
    version: 1.3.2
    version_base: '1.3'
    cwd: /nas/ganluo/Flow_RL/Test_FILE/verl_support_backup
    config_sources:
    - path: hydra.conf
      schema: pkg
      provider: hydra
    - path: /nas/ganluo/Flow_RL/verl/verl/trainer/config
      schema: file
      provider: main
    - path: ''
      schema: structured
      provider: schema
    output_dir: /nas/ganluo/Flow_RL/Test_FILE/verl_support_backup/outputs/2025-08-12/07-24-32
    choices:
      reward_model: dp_reward_model
      critic: dp_critic
      rollout@actor_rollout_ref.rollout: rollout
      ref@actor_rollout_ref.ref: dp_ref
      data: legacy_data
      npu_profile@trainer.npu_profile: npu_profile
      actor@actor_rollout_ref.actor: dp_actor
      hydra/env: default
      hydra/callbacks: null
      hydra/job_logging: default
      hydra/hydra_logging: default
      hydra/hydra_help: default
      hydra/help: default
      hydra/sweeper: basic
      hydra/launcher: basic
      hydra/output: default
  verbose: false
